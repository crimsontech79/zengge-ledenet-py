name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor -- the reference machine ships it, and the library is
        # written to work there. Newer versions guard against drift.
        python-version: ['3.9', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        # Standard library only -- no install step, and nothing to pin.
        run: python -m unittest discover -s tests -t . -v
